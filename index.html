<!doctype html>
<html lang="en" data-style="modern" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker v2 — Daily Habits, Streaks &amp; Heatmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint — no white flash.
      try {
        var s = window.localStorage.getItem("showcase-style");
        var m = window.localStorage.getItem("showcase-mode");
        document.documentElement.dataset.style =
          s === "achaemenid" || s === "modern" ? s : "modern";
        document.documentElement.dataset.mode =
          m === "dark" || m === "light"
            ? m
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.style = "modern";
        document.documentElement.dataset.mode = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
